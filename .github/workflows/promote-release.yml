name: Release - Promote to Production

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-published-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote master to production
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEY_GITHUB_ACTIONS_BOT_PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.HOMEY_GITHUB_ACTIONS_BOT_PERSONAL_ACCESS_TOKEN }}

      - name: Check promotion readiness
        id: readiness
        run: |
          set -euo pipefail

          skip_promotion() {
            local reason="$1"

            echo "Promotion skipped: $reason"
            echo "::notice title=Production promotion skipped::$reason"
            {
              echo "## Production promotion skipped"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          git fetch origin \
            "+refs/heads/master:refs/remotes/origin/master" \
            "+refs/heads/production:refs/remotes/origin/production" \
            --force \
            --tags

          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v$VERSION"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,publishedAt,url 2>/dev/null || true)"

          if [ -z "$RELEASE_JSON" ]; then
            skip_promotion "No GitHub Release exists for $RELEASE_TAG yet. Create and publish a stable release before promoting master."
          fi

          IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")"
          PUBLISHED_AT="$(jq -r '.publishedAt // empty' <<< "$RELEASE_JSON")"
          RELEASE_URL="$(jq -r '.url' <<< "$RELEASE_JSON")"

          if [ "$IS_DRAFT" = "true" ]; then
            skip_promotion "GitHub Release $RELEASE_TAG is still a draft. Publish it as a stable release before promoting master."
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            skip_promotion "GitHub Release $RELEASE_TAG is a prerelease. Only stable releases can be promoted to production."
          fi

          if [ -z "$PUBLISHED_AT" ]; then
            skip_promotion "GitHub Release $RELEASE_TAG has not been published yet. Publish it as a stable release before promoting master."
          fi

          if ! git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            skip_promotion "Git tag $RELEASE_TAG does not exist. Create the tag before promoting master."
          fi

          if ! git diff --quiet "$RELEASE_TAG^{tree}" "origin/master^{tree}"; then
            skip_promotion "Master does not match the contents of tag $RELEASE_TAG. Merge the tagged release contents into master before promoting it."
          fi

          PRODUCTION_VERSION="$(git show origin/production:package.json | node -e "let json = ''; process.stdin.on('data', chunk => { json += chunk; }); process.stdin.on('end', () => { process.stdout.write(JSON.parse(json).version); });")"

          if [ "$PRODUCTION_VERSION" = "$VERSION" ]; then
            skip_promotion "$RELEASE_TAG is already the production version. No promotion pull request is needed."
          fi

          OPEN_PR_URL="$(gh pr list --state open --base production --head master --json url --jq '.[0].url // empty')"

          if [ -n "$OPEN_PR_URL" ]; then
            skip_promotion "A master to production pull request is already open: $OPEN_PR_URL"
          fi

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Promotion ready: $RELEASE_TAG can be promoted from master to production."

      - name: Open production promotion pull request
        if: steps.readiness.outputs.ready == 'true'
        env:
          RELEASE_TAG: ${{ steps.readiness.outputs.tag }}
          RELEASE_URL: ${{ steps.readiness.outputs.release_url }}
        run: |
          set -euo pipefail

          gh pr create \
            --base production \
            --head master \
            --title "Release $RELEASE_TAG to production" \
            --body "Promotes the published $RELEASE_TAG release from master to production. Merging this pull request publishes the package to npm: $RELEASE_URL"
