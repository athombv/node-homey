name: Publish to NPM

on:
  workflow_dispatch:
  push:
    branches:
      - testing
      - production

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'

      # Sets package.json name & version to environment.
      - name: Get Package Info
        id: package
        run: |
          NAME="$(node -p "require('./package.json').name")"
          echo "package_name=$NAME" >> "$GITHUB_ENV"

          VERSION="$(node -p "require('./package.json').version")"
          echo "package_version=$VERSION" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package configuration
        run: |
          if ! jq --exit-status '.files | type == "array" and length > 0' package.json >/dev/null; then
            echo "Missing 'files' array in package.json."
            exit 1
          fi

      - name: Verify published GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,publishedAt,tagName 2>/dev/null)" || {
            echo "::error::A published GitHub Release for $RELEASE_TAG is required before publishing to npm."
            exit 1
          }

          IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")"
          PUBLISHED_AT="$(jq -r '.publishedAt // empty' <<< "$RELEASE_JSON")"
          RELEASE_TAG_NAME="$(jq -r '.tagName' <<< "$RELEASE_JSON")"

          if [ "$IS_DRAFT" = "true" ] || [ "$IS_PRERELEASE" = "true" ] || [ -z "$PUBLISHED_AT" ]; then
            echo "::error::$RELEASE_TAG must be a published stable GitHub Release."
            exit 1
          fi

          if [ "$RELEASE_TAG_NAME" != "$RELEASE_TAG" ]; then
            echo "::error::Expected release tag $RELEASE_TAG, but found $RELEASE_TAG_NAME."
            exit 1
          fi

          if ! git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Git tag $RELEASE_TAG does not exist."
            exit 1
          fi

          TAG_VERSION="$(git show "$RELEASE_TAG:package.json" | node -e "let json = ''; process.stdin.on('data', chunk => { json += chunk; }); process.stdin.on('end', () => { process.stdout.write(JSON.parse(json).version); });")"

          if [ "$TAG_VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "::error::Git tag $RELEASE_TAG contains package version $TAG_VERSION."
            exit 1
          fi

          if ! git diff --quiet "$RELEASE_TAG^{tree}" "$GITHUB_SHA^{tree}"; then
            echo "::error::Production contents do not match the tagged $RELEASE_TAG release contents."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --audit=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HOMEY_GITHUB_ACTIONS_BOT_PERSONAL_ACCESS_TOKEN }}

      - name: Build
        run: |
          if jq --exit-status '.scripts | has("build")' package.json; then
            echo "'npm run build' does exist. Building..."
            npm run build
          else
            echo "'npm run build' does not exist. Skipping build..."
          fi

      - name: Configure NPM for publish
        run: |
          cat <<EOF > "$NPM_CONFIG_USERCONFIG"
          registry=https://registry.npmjs.org/
          EOF

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --tag beta --registry https://registry.npmjs.org

      - name: Check stable package status
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        id: stable_package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          PUBLISHED_GIT_HEAD="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" gitHead --registry https://registry.npmjs.org 2>/dev/null || true)"

          if [ -z "$PUBLISHED_GIT_HEAD" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PUBLISHED_GIT_HEAD" != "$GITHUB_SHA" ]; then
            echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION already exists on npm from commit $PUBLISHED_GIT_HEAD."
            exit 1
          fi

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "publish_status=Already published" >> "$GITHUB_ENV"

      - name: Prepare Slack release notification
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        id: slack_release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RAW_SLACK_CHANNEL_ID: ${{ vars.SLACK_DEVELOPMENT_NOTIFICATIONS_CHANNEL_ID }}
          RELEASE_TAG: v${{ steps.package.outputs.version }}
          SLACK_TOKEN: ${{ secrets.SLACK_HOMEY_GITHUB_APP }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_TOKEN" ]; then
            echo "::error::SLACK_HOMEY_GITHUB_APP is not available to this repository."
            exit 1
          fi

          SLACK_CHANNEL_ID="$(printf '%s' "$RAW_SLACK_CHANNEL_ID" | xargs)"
          if [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "::error::SLACK_DEVELOPMENT_NOTIFICATIONS_CHANNEL_ID is not available to this repository."
            exit 1
          fi

          RELEASE_JSON_PATH="$RUNNER_TEMP/github-release.json"
          SLACK_PAYLOAD_PATH="$RUNNER_TEMP/slack-release-notification.json"
          gh release view "$RELEASE_TAG" --json body,name,url > "$RELEASE_JSON_PATH"

          export RELEASE_JSON_PATH SLACK_CHANNEL_ID SLACK_PAYLOAD_PATH
          node <<'NODE'
          const fs = require('node:fs');

          function escapeSlackText(text) {
            return text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
          }

          function convertInlineMarkdown(text) {
            const links = [];
            let formatted = text.replace(/\[([^\]]+)]\((https?:\/\/[^)\s]+)\)/g, (_match, label, url) => {
              const placeholder = `SLACK-LINK-TOKEN-${links.length}`;
              links.push({ label, placeholder, url });

              return placeholder;
            });

            formatted = escapeSlackText(formatted)
              .replace(/\*\*([^*\n]+)\*\*/g, '*$1*')
              .replace(/__([^_\n]+)__/g, '*$1*')
              .replace(/~~([^~\n]+)~~/g, '~$1~')
              .replace(/https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/pull\/(\d+)/g, (url, number) => {
                return `<${url}|#${number}>`;
              })
              .replace(
                /https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/compare\/([^\s]+?)\.\.\.([^\s]+)/g,
                (url, from, to) => {
                  return `<${url}|${from}…${to}>`;
                },
              );

            for (const link of links) {
              const slackLink = `<${escapeSlackText(link.url)}|${escapeSlackText(link.label)}>`;
              formatted = formatted.replace(link.placeholder, slackLink);
            }

            return formatted;
          }

          function convertGitHubMarkdownToSlack(markdown) {
            const formattedLines = [];

            for (const line of markdown.split('\n')) {
              const heading = line.match(/^#{1,6}\s+(.+)$/);
              if (heading) {
                formattedLines.push(`*${convertInlineMarkdown(heading[1])}*`);
                continue;
              }

              const bullet = line.match(/^(\s*)[-*+]\s+(.+)$/);
              if (bullet) {
                formattedLines.push(`${bullet[1]}• ${convertInlineMarkdown(bullet[2])}`);
                continue;
              }

              formattedLines.push(convertInlineMarkdown(line));
            }

            return formattedLines.join('\n');
          }

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON_PATH, 'utf8'));
          const packageVersion = process.env.PACKAGE_VERSION;
          const packageName = process.env.PACKAGE_NAME;
          const npmUrl = `https://www.npmjs.com/package/${packageName}/v/${packageVersion}`;
          const releaseName = release.name || `v${packageVersion}`;
          const githubNotes = release.body?.trim() || 'No release notes were provided.';
          const notes = convertGitHubMarkdownToSlack(githubNotes);
          const chunks = [];
          let remainder = notes;

          while (remainder && chunks.length < 12) {
            let splitAt = Math.min(2800, remainder.length);
            if (splitAt < remainder.length) {
              const newline = remainder.lastIndexOf('\n', splitAt);
              if (newline > 1400) splitAt = newline;
            }

            chunks.push(remainder.slice(0, splitAt).trim());
            remainder = remainder.slice(splitAt).trim();
          }

          if (remainder) {
            chunks.push(`_The changelog was shortened for Slack. <${release.url}|View the complete release notes>._`);
          }

          const payload = {
            channel: process.env.SLACK_CHANNEL_ID,
            text: `${packageName}@${packageVersion} was published to npm. ${release.url}`,
            blocks: [
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: `:rocket: *<${release.url}|${releaseName}> published to npm*`,
                },
              },
              { type: 'divider' },
              ...chunks.map((chunk) => {
                return {
                  type: 'section',
                  text: { type: 'mrkdwn', text: chunk },
                };
              }),
              {
                type: 'actions',
                elements: [
                  {
                    type: 'button',
                    text: { type: 'plain_text', text: 'GitHub Release' },
                    url: release.url,
                  },
                  {
                    type: 'button',
                    text: { type: 'plain_text', text: 'View on npm' },
                    url: npmUrl,
                  },
                ],
              },
            ],
          };

          fs.writeFileSync(process.env.SLACK_PAYLOAD_PATH, JSON.stringify(payload));
          NODE

          echo "payload_path=$SLACK_PAYLOAD_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish stable package
        if: github.event_name == 'push' && github.ref == 'refs/heads/production' && steps.stable_package.outputs.publish == 'true'
        run: |
          npm publish --registry https://registry.npmjs.org
          echo "publish_status=Published" >> "$GITHUB_ENV"

      - name: Notify Slack of stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_HOMEY_GITHUB_APP }}
          payload-file-path: ${{ steps.slack_release.outputs.payload_path }}

      - name: Publish (beta)
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
        run: |
          npm publish --tag beta --registry https://registry.npmjs.org
          echo "publish_status=Published beta" >> "$GITHUB_ENV"

      - name: Slack publish status
        if: always() && github.event_name != 'workflow_dispatch'
        uses: innocarpe/actions-slack@v1
        with:
          status: ${{ job.status }}
          success_text: '${{ github.repository }} - ${{ env.publish_status }} ${{ env.package_name }}@${{ env.package_version }} to npm 🚀'
          failure_text: '${{ github.repository }} - Release workflow failed for ${{ env.package_name }}@${{ env.package_version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
